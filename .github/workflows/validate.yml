name: validate-runtime-control

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-runtime-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install "PyYAML>=6.0,<7"
      - name: Validate public allowlist
        run: |
          python - <<'PY'
          import re
          import yaml
          d = yaml.safe_load(open("deployment.yaml", encoding="utf-8"))
          assert isinstance(d, dict)
          assert set(d) <= {"schema_version", "document_type", "updated_at", "deployment", "core"}
          assert d["schema_version"] == "0.4"
          assert d["document_type"] == "deployment_binding"
          assert set(d["deployment"]) == {"id", "topology", "epoch", "write_state"}
          assert set(d["core"]) <= {"repository_id", "commit", "repository_full_name"}
          assert {"repository_id", "commit"} <= set(d["core"])
          assert d["deployment"]["topology"] == "split"
          assert d["deployment"]["write_state"] in {"active", "frozen"}
          assert isinstance(d["deployment"]["epoch"], int) and d["deployment"]["epoch"] > 0
          assert isinstance(d["core"]["repository_id"], int) and d["core"]["repository_id"] > 0
          assert re.fullmatch(r"[0-9a-f]{40}", d["core"]["commit"])
          forbidden = {"instance", "instance_repository_id", "active_generation",
                       "pending_handoff", "migration_transaction", "credentials",
                       "token", "secret"}
          def keys(value):
              if isinstance(value, dict):
                  for key, nested in value.items():
                      yield key
                      yield from keys(nested)
              elif isinstance(value, list):
                  for nested in value:
                      yield from keys(nested)
          assert forbidden.isdisjoint(keys(d))
          PY
      - name: Verify exact Core commit exists
        shell: bash
        run: |
          commit="$(sed -n 's/^  commit: *//p' deployment.yaml)"
          git init _core
          git -C _core remote add origin https://github.com/suxyddjdgys-arch/learning-os-core.git
          git -C _core fetch --depth 1 origin "$commit"
          test "$(git -C _core rev-parse FETCH_HEAD)" = "$commit"
